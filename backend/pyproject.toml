[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velma"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic-settings",
  "psycopg[binary,pool]",
  "openai",
  "httpx",
  "tavily-python",
  "boto3",
  "jinja2",
  "textstat",
  "matplotlib",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.j2", "*.md"]
